entities:
- name: Shop
  root_field: shop
  identity: singleton
  description: >-
    The ColdSnap store itself — name, primary domain, brand, payment settings, shipping
    countries and the policy documents.
  key_fields: [name, description, primaryDomain, brand, paymentSettings, shipsToCountries, metafields]
  policy_fields: [privacyPolicy, termsOfService, refundPolicy, shippingPolicy, subscriptionPolicy, termsOfSale, contactInformation, legalNotice]
- name: Product
  root_field: products
  lookup_fields: [product, productByHandle]
  identity: gid://shopify/Product/{id} + handle
  description: A sellable ColdSnap item — a machine, a pod pack, an accessory or merchandise.
  key_fields: [id, handle, title, description, productType, vendor, tags, availableForSale, priceRange, compareAtPriceRange, featuredImage, options, seo, createdAt, updatedAt, publishedAt]
- name: ProductVariant
  identity: gid://shopify/ProductVariant/{id}
  description: A purchasable configuration of a product — the unit that actually enters a cart.
  key_fields: [id, title, sku, barcode, price, compareAtPrice, availableForSale, quantityAvailable, requiresShipping, selectedOptions, weight, unitPrice]
- name: Collection
  root_field: collections
  lookup_fields: [collection, collectionByHandle]
  identity: gid://shopify/Collection/{id} + handle
  description: A merchandising grouping — Premium Ice Cream, Machine, ColdSnap Pods, Accessories, Merchandise.
  key_fields: [id, handle, title, description, image, updatedAt, seo]
- name: Cart
  root_field: cart
  identity: gid://shopify/Cart/{id}
  description: >-
    The agent-visible order in progress. The MCP update_cart tool is a consolidated
    projection over eleven cart mutations.
  key_fields: [id, checkoutUrl, totalQuantity, createdAt, updatedAt, note, attributes, appliedGiftCards]
- name: CartLine
  identity: gid://shopify/CartLine/{id}
  implements: [BaseCartLine, Node]
  description: One variant plus quantity within a cart.
  key_fields: [id, quantity, cost, attributes]
- name: CartDeliveryGroup
  description: Shipping grouping for a cart, carrying the address and the selectable delivery options.
  key_fields: [id, groupType, deliveryOptions, selectedDeliveryOption]
- name: Customer
  identity: authenticated-only
  description: >-
    A signed-in shopper. Unreachable anonymously — requires a customer access token issued
    through the Shopify customer-accounts OIDC flow. No MCP tool exposes it.
  key_fields: [id, email, firstName, lastName, phone, displayName, acceptsMarketing, createdAt]
- name: Order
  identity: gid://shopify/Order/{id}
  description: A completed purchase, reachable only through an authenticated Customer.
  key_fields: [id, orderNumber, processedAt, financialStatus, fulfillmentStatus, currencyCode, totalPrice, statusUrl]
- name: MailingAddress
  identity: gid://shopify/MailingAddress/{id}
  description: A shipping or billing address on a customer, cart delivery group or order.
  key_fields: [id, address1, address2, city, province, country, zip, phone, formatted]
- name: Blog
  root_field: blogs
  lookup_fields: [blog, blogByHandle]
  description: An editorial container. ColdSnap runs two — News (0 articles) and Blog (78 articles).
  key_fields: [id, handle, title, seo]
- name: Article
  root_field: articles
  lookup_fields: [article]
  description: A ColdSnap blog post — case studies, engineering explainers, vertical guides.
  key_fields: [id, handle, title, content, excerpt, image, publishedAt, tags, seo]
- name: Page
  root_field: pages
  lookup_fields: [page, pageByHandle]
  description: >-
    A static store page — 38 of them, covering the vertical landing pages (restaurants,
    golf, colleges, senior living, micro markets), patents, investors, press and FAQ.
  key_fields: [id, handle, title, body, bodySummary, seo, createdAt, updatedAt]
- name: Menu
  root_field: menu
  description: Navigation structure, resolved by handle.
  key_fields: [id, handle, title, items, itemsCount]
- name: Metaobject
  root_field: metaobjects
  lookup_fields: [metaobject]
  description: Custom structured content records defined by the merchant.
  key_fields: [id, handle, type, fields, updatedAt]
- name: SellingPlan
  description: A subscription or deferred-purchase plan attached to a variant.
  key_fields: [id, name, description, recurringDeliveries, options, priceAdjustments]
- name: Location
  root_field: locations
  description: A physical store or fulfillment location.
  key_fields: [id, name, address]
- name: Image
  description: A media asset on a product, variant, collection or article.
  key_fields: [id, url, altText, width, height]
- name: Fulfillment
  description: A shipment against an order, with tracking.
  key_fields: [trackingCompany, trackingInfo, fulfillmentLineItems]
- name: Metafield
  description: Merchant-defined key/value extension available on most entities via HasMetafields.
  key_fields: [id, namespace, key, value, type, reference, references]
