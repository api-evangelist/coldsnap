aid: coldsnap
name: ColdSnap
description: 'ColdSnap (formerly Sigma Phase, Corp.) is a Billerica, Massachusetts
  hardware and frozen-confection company founded in October 2018 by Matt Fonte, whose
  plug-and-play countertop appliance chills and churns a single serving of premium
  ice cream, frozen yogurt, non-dairy dessert, frozen latte, protein shake, smoothie
  or frozen cocktail from a shelf-stable recyclable pod in about two minutes, with
  no refrigeration, plumbing or cleaning between servings. The company commercially
  launched in April 2024 and sells machines, pods and accessories to restaurants and
  bars, hotels, golf and sports clubs, colleges, senior living, car dealerships, offices,
  convenience stores and micro markets. Its digital surface is a Shopify-hosted commerce
  storefront at coldsnap.com serving a live, anonymously introspectable Storefront
  GraphQL API, an anonymous Model Context Protocol server at /api/mcp, a Universal
  Commerce Protocol (UCP) merchant profile and agentic-commerce endpoint, plus published
  llms.txt and agents.md agent-instruction documents.'
