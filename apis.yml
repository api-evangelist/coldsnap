apis:
- name: ColdSnap Storefront GraphQL API
  description: 'The live Shopify Storefront GraphQL API served from the ColdSnap primary
    domain. Anonymously introspectable: a full introspection query returns 428 types,
    35 root query fields and 41 mutations covering products, collections, variants,
    blogs, articles, pages, menus, metaobjects, predictive search, localization, cart
    creation and mutation, delivery and discount handling, and customer access tokens.
    Versioned on Shopify''s dated quarterly API version train; 2025-10 through 2026-07
    are reported supported.'
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://coldsnap.com/api/2026-07/graphql.json
  tags:
  - GraphQL
  - Commerce
  - Catalog
  - Cart
  - Storefront
  properties:
  - type: GraphQL
    url: graphql/coldsnap-storefront.graphql
  - type: APIReference
    url: https://shopify.dev/docs/api/storefront
  - type: Authentication
    url: authentication/coldsnap-authentication.yml
  - type: DataModel
    url: data-model/coldsnap-data-model.yml
- name: ColdSnap Storefront MCP Server
  description: 'An anonymous, production Model Context Protocol server served from
    the ColdSnap domain at /api/mcp. A live tools/list returns five tools with full
    JSON Schema input contracts: search_catalog, get_product_details, get_cart, update_cart
    and search_shop_policies_and_faqs. The server identifies as storefront-renderer
    0.1.0 and negotiates MCP protocol version 2025-06-18, advertising tools, prompts,
    resources and logging capabilities; prompts and resources are currently empty lists.
    Tool responses conform to Universal Commerce Protocol shopping capabilities.'
  humanURL: https://coldsnap.com/agents.md
  baseURL: https://coldsnap.com/api/mcp
  tags:
  - MCP
  - Agents
  - Commerce
  - Agentic Commerce
  properties:
  - type: MCPServer
    url: mcp/coldsnap-mcp.yml
  - type: ToolCrosswalk
    url: mcp/coldsnap-tool-crosswalk.yml
  - type: AgenticAccess
    url: agentic-access/coldsnap-agentic-access.yml
- name: ColdSnap Store JSON (Ajax) API
  description: 'The unauthenticated read-only JSON surface Shopify serves from the
    ColdSnap storefront and which the store''s own agents.md advertises to agents:
    /products.json and /collections.json catalog listings, per-product /products/{handle}.json
    documents, /collections/{handle}/products.json, /cart.js cart state, /search, and
    /sitemap.xml including a dedicated agentic-discovery sitemap. No OpenAPI description
    is published for this surface by either ColdSnap or the platform.'
  humanURL: https://coldsnap.com/agents.md
  baseURL: https://coldsnap.com/
  tags:
  - JSON
  - Catalog
  - Commerce
  - Read Only
  properties:
  - type: Documentation
    url: https://coldsnap.com/agents.md
  - type: Sitemap
    url: https://coldsnap.com/sitemap.xml
