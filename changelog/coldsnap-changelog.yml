note: >-
  ColdSnap publishes no API changelog of its own. What it does serve is a live, queryable
  version train — the store answers a publicApiVersions query naming exactly which dated
  API versions it will accept — and RFC 8594 Deprecation/Sunset headers on its MCP
  endpoint. That version train is the changelog a consumer of this API actually integrates
  against, so it is captured here as observed on the store's own hosts, with the platform
  changelog recorded as the narrative companion. Nothing below is a ColdSnap release note.
